<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - Workforce Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/global-footer.css">
    <script src="js/project-version.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 text-sm">

    <!-- Card de Autentificare -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 text-center space-y-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-100">Workforce Panel</h1>
            <p class="text-xs text-slate-400 mt-1">Autentifică-te folosind contul tău de Discord pentru a continua.</p>
        </div>

        <div class="py-4 flex justify-center">
            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-3xl">
                🔐
            </div>
        </div>

        <!-- Butonul de Login Discord -->
        <button id="discord-login-btn" class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg flex items-center justify-center space-x-2 cursor-pointer text-sm">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            <span>Conectare cu Discord</span>
        </button>

        <p id="status-msg" class="text-xs text-slate-400"></p>
    </div>

    <!-- Script de Autentificare și Sincronizare Supabase -->
    <script>
        const SUPABASE_URL = "https://vkvsabbbawyiurnaiugo.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrdnNhYmJiYXd5aXVybmFpdWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDY5NTYsImV4cCI6MjEwMDYyMjk1Nn0.s2R8mdsoeQzOyz7a-NJOi5SQmyDmyy98cfUMfGqLo44";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const CLIENT_ID = "1531023771211792384"; 
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        document.getElementById('discord-login-btn').addEventListener('click', () => {
            const discordAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20email%20guilds.members.read`;
            window.location.href = discordAuthUrl;
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            
            // Dacă avem token în hash (venit de la Discord)
            if (hash && hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                
                if (accessToken) {
                    // Curățăm URL-ul imediat să prevenim buclele
                    window.history.replaceState({}, document.title, window.location.pathname);
                    document.getElementById('status-msg').textContent = "Se procesează datele de autentificare...";
                    await processDiscordLogin(accessToken);
                }
            } else {
                // Dacă nu suntem în timpul callback-ului, verificăm dacă utilizatorul are deja sesiune validă
                const existingUser = localStorage.getItem('discord_user');
                if (existingUser) {
                    try {
                        const parsed = JSON.parse(existingUser);
                        if (parsed && parsed.discord_id) {
                            window.location.href = 'index.html';
                            return;
                        }
                    } catch (e) {
                        localStorage.clear();
                    }
                }
            }
        });

        async function processDiscordLogin(token) {
            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Eșec la preluarea profilului de pe Discord.');
                const discordData = await response.json();
                const discordId = discordData.id;

                document.getElementById('status-msg').textContent = "Se verifică rolul tău pe serverul Discord...";

                const syncResponse = await fetch(`${SUPABASE_URL}/functions/v1/sync-discord-role`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        apikey: SUPABASE_KEY,
                        authorization: `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ access_token: token })
                });
                const syncResult = await syncResponse.json();
                if (!syncResponse.ok || !syncResult.user) {
                    throw new Error(syncResult.error || 'Rolul Discord nu a putut fi verificat.');
                }

                const syncedUser = syncResult.user;
                localStorage.setItem('discord_user', JSON.stringify(syncedUser));
                localStorage.setItem('user_role', syncedUser.role);
                localStorage.setItem('discord_access_token', token);

                document.getElementById('status-msg').textContent = `Autentificare reușită! Rol sincronizat: ${syncedUser.role}.`;
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 400);
                return;

                // Căutare în tabelul `users` după discord_id
                let { data: dbUser, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('discord_id', discordId)
                    .maybeSingle();

                const avatarVal = discordData.avatar 
                    ? `https://cdn.discordapp.com/avatars/${discordId}/${discordData.avatar}.png`
                    : `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f468-200d-1f4bb.png`;

                let finalUserData = {};

                if (!dbUser) {
                    // Dacă nu există în tabel, îl creăm cu datele de bază
                    finalUserData = {
                        discord_id: discordId,
                        username: discordData.username,
                        display_name: discordData.global_name || discordData.username,
                        email: discordData.email || null,
                        avatar: avatarVal,
                        role: 'Mecanic',
                        service: 'Atelier',
                        created_at: new Date().toISOString(),
                        maintenance_mode: false,
                        discord_logs_active: true,
                        threshold_value: 0,
                        max_shift_hours: 8,
                        default_role: 'Mecanic'
                    };

                    await supabaseClient.from('users').upsert([finalUserData], { onConflict: 'discord_id' });
                } else {
                    // Dacă există, preluăm datele reale din baza ta de date
                    finalUserData = {
                        discord_id: dbUser.discord_id,
                        username: dbUser.username,
                        display_name: dbUser.display_name || dbUser.username,
                        email: dbUser.email,
                        avatar: dbUser.avatar || avatarVal,
                        role: dbUser.role || dbUser.default_role || 'Mecanic',
                        service: dbUser.service || 'Atelier',
                        created_at: dbUser.created_at,
                        maintenance_mode: dbUser.maintenance_mode || false,
                        discord_logs_active: dbUser.discord_logs_active !== null ? dbUser.discord_logs_active : true,
                        threshold_value: dbUser.threshold_value || 0,
                        max_shift_hours: dbUser.max_shift_hours || 8,
                        default_role: dbUser.default_role || 'Mecanic'
                    };
                }

                // Salvăm sesiunea completă în localStorage
                localStorage.setItem('discord_user', JSON.stringify(finalUserData));
                localStorage.setItem('user_role', finalUserData.role);
                localStorage.setItem('discord_access_token', token);

                document.getElementById('status-msg').textContent = "Autentificare reușită! Se redirecționează...";
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 400);

            } catch (err) {
                console.error('Erore login:', err);
                document.getElementById('status-msg').textContent = "A apărut o eroare la autentificare.";
                localStorage.clear();
            }
        }
    </script>
    <script src="js/global-footer.js"></script>
</body>
</html>
