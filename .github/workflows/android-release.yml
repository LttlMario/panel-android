name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PANEL_RELEASE_KEYSTORE_BASE64: ${{ secrets.PANEL_RELEASE_KEYSTORE_BASE64 }}
      PANEL_RELEASE_STORE_PASSWORD: ${{ secrets.PANEL_RELEASE_STORE_PASSWORD }}
      PANEL_RELEASE_KEY_ALIAS: ${{ secrets.PANEL_RELEASE_KEY_ALIAS }}
      PANEL_RELEASE_KEY_PASSWORD: ${{ secrets.PANEL_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web assets
        shell: bash
        run: |
          npm ci
          npm run build:web
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -R www/. android/app/src/main/assets/public/

      - name: Restore release keystore
        shell: bash
        run: |
          test -n "$PANEL_RELEASE_KEYSTORE_BASE64"
          mkdir -p android/signing
          printf '%s' "$PANEL_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/signing/panel-release.jks
          echo "PANEL_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/android/signing/panel-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-android-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/*.apk \
            android/app/build/outputs/bundle/release/*.aab \
            --title "Panel Android $GITHUB_REF_NAME" \
            --generate-notes
